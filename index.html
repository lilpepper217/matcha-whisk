<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matcha Whisk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#e6dfcc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
a{color:#4a6741}a:hover{color:#3a5233}
@keyframes mwFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes mwPop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes mwFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes mwSteam{0%{opacity:0;transform:translateY(2px) scaleX(1)}40%{opacity:.55}100%{opacity:0;transform:translateY(-14px) scaleX(1.5)}}
@keyframes mwBowlNudge{0%,100%{transform:rotate(0deg) translateY(0)}50%{transform:rotate(-6deg) translateY(-5px)}}
    @keyframes mwTinIn{0%{transform:translate(-140px,-6px) rotate(0deg)}55%{transform:translate(0,0) rotate(0deg)}100%{transform:translate(0,0) rotate(52deg)}}
    @keyframes mwTinOut{0%{transform:translate(0,0) rotate(52deg)}45%{transform:translate(0,0) rotate(0deg)}100%{transform:translate(-140px,-6px) rotate(0deg)}}
    @keyframes mwPowder{0%{transform:translateY(0) scale(.7);opacity:0}20%{opacity:1}100%{transform:translateY(74px) scale(1);opacity:.15}}
    @keyframes mwStream{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
@keyframes mwSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes mwKettleIn{from{opacity:0;transform:translate(46px,110px)}to{opacity:1;transform:translate(0,0)}}
@keyframes mwRipple{0%{transform:scale(.25);opacity:.55}100%{transform:scale(1.8);opacity:0}}
@keyframes mwWobble{0%,100%{transform:rotate(-19deg)}50%{transform:rotate(-24deg)}}
</style>
</helmet>
<div style="width:393px;height:852px;position:relative;overflow:hidden;background:#f2ead6;font-family:'EB Garamond',Georgia,serif;color:#3f3a2e;user-select:none">

  <div style="position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,#f7f1e1 0%,#efe5cd 70%,#e9dec2 100%)"></div>

  <div style="position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:34px 22px 22px">

    <div style="position:relative;width:46px;height:34px;animation:mwFloat 5s ease-in-out infinite">
      <div style="position:absolute;left:14px;top:-2px;width:4px;height:12px;border-radius:2px;background:#8a7449;opacity:.4;animation:mwSteam 3.2s ease-out infinite"></div>
      <div style="position:absolute;left:26px;top:-2px;width:4px;height:12px;border-radius:2px;background:#8a7449;opacity:.4;animation:mwSteam 3.2s ease-out .9s infinite"></div>
      <svg viewBox="0 0 46 34" width="46" height="34"><ellipse cx="23" cy="30" rx="15" ry="3.4" fill="#8a7449" opacity=".35"></ellipse><path d="M5 12h36c0 10-8 16-18 16S5 22 5 12z" fill="#dfe3d8" stroke="#3f3a2e" stroke-width="2.2" stroke-linejoin="round"></path><ellipse cx="23" cy="12" rx="18" ry="5.4" fill="#8fbc6a" stroke="#3f3a2e" stroke-width="2.2"></ellipse><ellipse cx="23" cy="11.4" rx="11" ry="3" fill="#eef6df"></ellipse></svg>
    </div>

    <h1 style="margin:2px 0 0;font-size:44px;font-weight:400;letter-spacing:-.5px;line-height:1.05">{{ heading }}</h1>

    <p style="margin:10px 0 0;text-align:center;font-size:16.5px;line-height:1.42;max-width:300px;color:#4a4436;text-wrap:pretty">{{ subhead }}</p>

    <p style="margin:26px 0 0;min-height:40px;text-align:center;font-family:'Space Mono',monospace;font-size:12.5px;font-weight:700;line-height:1.55;letter-spacing:.1px;max-width:290px;color:#3f3a2e;animation:mwFade .4s ease both">{{ instruction }}</p>

    <sc-if value="{{ isStart }}" hint-placeholder-val="{{ true }}">
      <div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:22px 26px;width:100%;max-width:320px">

        <button onClick="{{ pick0 }}" style="all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:9px;animation:mwPop .45s ease both" style-hover="transform:translateY(-3px)">
          <img src="uploads/tin_isuzu.png" alt="" width="84" height="104" style="display:block;height:104px;width:auto;filter:drop-shadow(0 6px 5px rgba(138,116,73,.28))">
          <span style="font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700">isuzu matcha</span>
        </button>

        <button onClick="{{ pick1 }}" style="all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:9px;animation:mwPop .45s ease .06s both" style-hover="transform:translateY(-3px)">
          <img src="uploads/tin_ogura.png" alt="" width="84" height="104" style="display:block;height:104px;width:auto;filter:drop-shadow(0 6px 5px rgba(138,116,73,.28))">
          <span style="font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700">ogurayama</span>
        </button>

        <button onClick="{{ pick2 }}" style="all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:9px;animation:mwPop .45s ease .12s both" style-hover="transform:translateY(-3px)">
          <img src="uploads/tin_rocket.png" alt="" width="84" height="104" style="display:block;height:104px;width:auto;filter:drop-shadow(0 6px 5px rgba(138,116,73,.28))">
          <span style="font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700">rocky's matcha</span>
        </button>

        <button onClick="{{ pick3 }}" style="all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:9px;animation:mwPop .45s ease .18s both" style-hover="transform:translateY(-3px)">
          <img src="uploads/tin_yame.png" alt="" width="84" height="104" style="display:block;height:104px;width:auto;filter:drop-shadow(0 6px 5px rgba(138,116,73,.28))">
          <span style="font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700">nami yame</span>
        </button>

      </div>
    </sc-if>

    <sc-if value="{{ isBench }}" hint-placeholder-val="{{ false }}">
      <div style="position:relative;width:349px;flex:1;margin-top:4px">

        <button onClick="{{ tapTin }}" style="all:unset;cursor:pointer;position:absolute;left:8px;top:0;width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:opacity .4s ease,transform .3s ease;opacity:{{ tinOpacity }}">
          <sc-if value="{{ isIsuzu }}" hint-placeholder-val="{{ false }}"><img src="uploads/tin_isuzu.png" alt="" style="display:block;height:82px;width:auto;transform-origin:50% 100%;transition:transform .45s cubic-bezier(.34,1.4,.64,1);transform:{{ lidTransform }};filter:drop-shadow(0 5px 4px rgba(138,116,73,.3))"></sc-if>
          <sc-if value="{{ isOgura }}" hint-placeholder-val="{{ false }}"><img src="uploads/tin_ogura.png" alt="" style="display:block;height:82px;width:auto;transform-origin:50% 100%;transition:transform .45s cubic-bezier(.34,1.4,.64,1);transform:{{ lidTransform }};filter:drop-shadow(0 5px 4px rgba(138,116,73,.3))"></sc-if>
          <sc-if value="{{ isRocky }}" hint-placeholder-val="{{ false }}"><img src="uploads/tin_rocket.png" alt="" style="display:block;height:82px;width:auto;transform-origin:50% 100%;transition:transform .45s cubic-bezier(.34,1.4,.64,1);transform:{{ lidTransform }};filter:drop-shadow(0 5px 4px rgba(138,116,73,.3))"></sc-if>
          <sc-if value="{{ isNami }}" hint-placeholder-val="{{ false }}"><img src="uploads/tin_yame.png" alt="" style="display:block;height:82px;width:auto;transform-origin:50% 100%;transition:transform .45s cubic-bezier(.34,1.4,.64,1);transform:{{ lidTransform }};filter:drop-shadow(0 5px 4px rgba(138,116,73,.3))"></sc-if>
          <span style="font-family:'Space Mono',monospace;font-size:10px;font-weight:700;color:#9a8f74">Tin</span>
        </button>

        <button onClick="{{ tapChashaku }}" style="all:unset;cursor:pointer;position:absolute;right:6px;top:6px;width:96px;z-index:{{ chashakuZ }};display:flex;flex-direction:column;align-items:center;gap:4px;transition:opacity .4s ease;opacity:{{ chashakuOpacity }}">
          <img src="uploads/chashaku.png" alt="" style="display:block;width:82px;height:82px;transition:transform .55s cubic-bezier(.4,1.3,.5,1);transform:{{ chashakuTransform }}">
          <span style="font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:{{ chashakuLabel }}">Chashaku</span>
        </button>

        <button onClick="{{ tapKettle }}" style="all:unset;cursor:pointer;position:absolute;right:2px;bottom:26px;width:96px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:opacity .4s ease;opacity:{{ kettleOpacity }}">
          <img src="uploads/kettle.png" alt="" style="display:block;width:92px;height:85px;transition:transform .6s ease;transform:{{ kettleTransform }};filter:drop-shadow(0 5px 4px rgba(138,116,73,.28))">
          <span style="font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:{{ kettleLabel }}">Kettle</span>
        </button>

        <sc-if value="{{ tinPouring }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;left:150px;top:56px;z-index:5;transform-origin:82% 88%;animation:{{ tinPourAnim }}">
            <div>
              <sc-if value="{{ isIsuzu }}" hint-placeholder-val="{{ false }}"><img src="uploads/tin_isuzu.png" alt="" style="display:block;height:86px;width:auto;filter:drop-shadow(0 6px 6px rgba(138,116,73,.3))"></sc-if>
              <sc-if value="{{ isOgura }}" hint-placeholder-val="{{ false }}"><img src="uploads/tin_ogura.png" alt="" style="display:block;height:86px;width:auto;filter:drop-shadow(0 6px 6px rgba(138,116,73,.3))"></sc-if>
              <sc-if value="{{ isRocky }}" hint-placeholder-val="{{ false }}"><img src="uploads/tin_rocket.png" alt="" style="display:block;height:86px;width:auto;filter:drop-shadow(0 6px 6px rgba(138,116,73,.3))"></sc-if>
              <sc-if value="{{ isNami }}" hint-placeholder-val="{{ false }}"><img src="uploads/tin_yame.png" alt="" style="display:block;height:86px;width:auto;filter:drop-shadow(0 6px 6px rgba(138,116,73,.3))"></sc-if>
            </div>
          </div>
          <div style="position:absolute;left:186px;top:132px;width:5px;height:9px;border-radius:3px;background:#5f7d3e;z-index:5;animation:mwPowder .5s linear .5s infinite"></div>
          <div style="position:absolute;left:196px;top:130px;width:4px;height:7px;border-radius:3px;background:#6f8f45;z-index:5;animation:mwPowder .6s linear .62s infinite"></div>
          <div style="position:absolute;left:205px;top:134px;width:5px;height:8px;border-radius:3px;background:#547235;z-index:5;animation:mwPowder .55s linear .78s infinite"></div>
          <div style="position:absolute;left:192px;top:136px;width:3px;height:6px;border-radius:2px;background:#7fa055;z-index:5;animation:mwPowder .62s linear .9s infinite"></div>
        </sc-if>

        <sc-if value="{{ pouring }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;left:178px;top:-4px;width:92px;height:85px;z-index:3;animation:mwKettleIn .55s cubic-bezier(.3,1.2,.6,1) both">
            <div style="width:92px;height:85px;transform-origin:8% 66%;animation:mwWobble 1.6s ease-in-out .55s infinite">
              <img src="uploads/kettle.png" alt="" style="display:block;width:92px;height:85px">
            </div>
          </div>
          <div style="position:absolute;left:192px;top:48px;width:7px;height:98px;border-radius:4px;background:linear-gradient(#cfe0ee 0%,#e7f1f6 60%,rgba(231,241,246,.55) 100%);transform-origin:top;z-index:2;animation:mwStream .35s ease .5s both;opacity:.9"></div>
          <div style="position:absolute;left:172px;top:126px;width:48px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.7);z-index:2;animation:mwRipple 1s ease-out .8s infinite"></div>
          <div style="position:absolute;left:172px;top:126px;width:48px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.55);z-index:2;animation:mwRipple 1s ease-out 1.3s infinite"></div>
        </sc-if>

        <div style="position:absolute;left:0;right:0;top:118px;display:flex;flex-direction:column;align-items:center">
          <div style="position:relative;width:300px;height:300px">
            <canvas ref="{{ canvasRef }}" width="600" height="600" onPointerDown="{{ down }}" onPointerMove="{{ move }}" onPointerUp="{{ up }}" onPointerLeave="{{ up }}" style="position:relative;width:300px;height:300px;touch-action:none;cursor:{{ bowlCursor }}"></canvas>
          </div>
        </div>

        <sc-if value="{{ isWhisk }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;left:0;right:0;top:80px;display:flex;align-items:center;justify-content:center;gap:14px">
            <span style="font-family:'Space Mono',monospace;font-size:14px;font-weight:700;letter-spacing:.5px;color:{{ secondsColor }};transition:color .3s ease">{{ seconds }}s</span>
            <sc-if value="{{ hintDocked }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;align-items:center;gap:7px;padding:5px 10px 5px 7px;border-radius:20px;background:#efe7cf;border:1.4px solid #ddd0ac;animation:mwFade .35s ease both">
                <div style="width:22px;height:22px;border-radius:50%;border:1.8px solid #3f3a2e;background:{{ yourColor }}"></div>
                <span style="font-family:'Space Mono',monospace;font-size:9.5px;color:#8a7449">vs</span>
                <div style="width:22px;height:22px;border-radius:50%;border:1.8px solid #3f3a2e;background:{{ targetColor }};box-shadow:0 0 0 3px rgba(184,165,120,.35)"></div>
                <span style="font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;color:#6b6350">target</span>
              </div>
            </sc-if>
          </div>
        </sc-if>

        <sc-if value="{{ isWhisk }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center">
            <button onClick="{{ finish }}" style="all:unset;cursor:pointer;padding:13px 26px;border-radius:24px;background:#4a6741;color:#f7f1e1;font-family:'Space Mono',monospace;font-size:13.5px;box-shadow:0 3px 0 #35492f;transition:transform .12s ease" style-hover="background:#3f5a38" style-active="transform:translateY(2px);box-shadow:0 1px 0 #35492f">This Feels Right</button>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{ isLatte }}" hint-placeholder-val="{{ false }}">
      <div style="width:100%;flex:1;display:flex;flex-direction:column;align-items:center;margin-top:-8px">
        <div style="display:flex;flex-direction:{{ pickerDir }};gap:{{ pickerGap }};align-items:center;justify-content:center;margin-bottom:14px">
          <sc-for list="{{ syrups }}" as="s" hint-placeholder-count="3">
            <button onClick="{{ s.pick }}" style="all:unset;cursor:pointer;display:flex;flex-direction:row;align-items:center;gap:10px;padding:6px 10px;border-radius:16px;background:{{ s.bg }};transition:transform .2s ease,background .2s ease" style-hover="transform:translateY(-3px)">
              <div style="width:52px;height:52px;display:flex;align-items:center;justify-content:center">
                <sc-if value="{{ s.isStrawberry }}" hint-placeholder-val="{{ false }}">
                  <svg viewBox="0 0 52 52" width="48" height="48"><ellipse cx="26" cy="49" rx="12" ry="2.6" fill="#8a7449" opacity=".22"></ellipse><path d="M26 46c-9-4-14-12-14-20 0-6 6-10 14-10s14 4 14 10c0 8-5 16-14 20z" fill="#e0464b" stroke="#3f3a2e" stroke-width="2.4" stroke-linejoin="round"></path><circle cx="21" cy="26" r="1.7" fill="#ffe9b0"></circle><circle cx="31" cy="24" r="1.7" fill="#ffe9b0"></circle><circle cx="26" cy="34" r="1.7" fill="#ffe9b0"></circle><circle cx="34" cy="33" r="1.7" fill="#ffe9b0"></circle><circle cx="18" cy="34" r="1.7" fill="#ffe9b0"></circle><path d="M26 16c-6-2-11-1-13 2 4 3 9 3 13 1zm0 0c6-2 11-1 13 2-4 3-9 3-13 1z" fill="#5f8f43" stroke="#3f3a2e" stroke-width="2.2" stroke-linejoin="round"></path><path d="M26 16V9" stroke="#3f3a2e" stroke-width="2.4" stroke-linecap="round"></path><path d="M20 27c1-4 4-7 7-8" fill="none" stroke="#fff" stroke-width="2.2" opacity=".4" stroke-linecap="round"></path></svg>
                </sc-if>
                <sc-if value="{{ s.isBlueberry }}" hint-placeholder-val="{{ false }}">
                  <svg viewBox="0 0 52 52" width="48" height="48"><ellipse cx="26" cy="49" rx="13" ry="2.6" fill="#8a7449" opacity=".22"></ellipse><circle cx="18" cy="32" r="10" fill="#2f4a9c" stroke="#3f3a2e" stroke-width="2.4"></circle><circle cx="34" cy="34" r="9" fill="#25397c" stroke="#3f3a2e" stroke-width="2.4"></circle><circle cx="27" cy="21" r="10" fill="#3a58b4" stroke="#3f3a2e" stroke-width="2.4"></circle><path d="M27 21l-3-3 3 1 3-1z" fill="#1a2a5c"></path><circle cx="23" cy="17" r="2.4" fill="#fff" opacity=".45"></circle><path d="M40 22c4-3 7-3 9-1-3 4-7 5-9 3z" fill="#5f8f43" stroke="#3f3a2e" stroke-width="2.2" stroke-linejoin="round"></path></svg>
                </sc-if>
                <sc-if value="{{ s.isMango }}" hint-placeholder-val="{{ false }}">
                  <svg viewBox="0 0 52 52" width="48" height="48"><ellipse cx="26" cy="49" rx="12" ry="2.6" fill="#8a7449" opacity=".22"></ellipse><path d="M30 14c9 1 14 9 12 18-2 8-10 14-18 12S12 32 16 24s8-11 14-10z" fill="#f2b330" stroke="#3f3a2e" stroke-width="2.4" stroke-linejoin="round"></path><path d="M22 24c2-4 6-6 9-6" fill="none" stroke="#fff" stroke-width="2.4" opacity=".45" stroke-linecap="round"></path><path d="M31 13c4-4 9-5 12-3-2 5-7 7-11 6z" fill="#5f8f43" stroke="#3f3a2e" stroke-width="2.2" stroke-linejoin="round"></path></svg>
                </sc-if>
              </div>
              <sc-if value="{{ showSyrupNames }}" hint-placeholder-val="{{ false }}">
                <span style="font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700">{{ s.name }}</span>
              </sc-if>
            </button>
          </sc-for>
        </div>

        <div style="position:relative;width:170px;height:250px;margin-top:6px">
          <svg viewBox="0 0 170 250" width="170" height="250" style="position:absolute;inset:0">
            <ellipse cx="85" cy="238" rx="42" ry="6" fill="#8a7449" opacity=".22"></ellipse>
            <defs>
              <clipPath id="mwCup"><path d="M42 34h86l-11 190a8 8 0 0 1-8 7H61a8 8 0 0 1-8-7z"></path></clipPath>
              <linearGradient id="mwSyrupG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="{{ syrupColor }}" stop-opacity="0"></stop>
                <stop offset="0.34" stop-color="{{ syrupColor }}" stop-opacity="0.7"></stop>
                <stop offset="0.7" stop-color="{{ syrupColor }}" stop-opacity="1"></stop>
                <stop offset="1" stop-color="{{ syrupColor }}" stop-opacity="1"></stop>
              </linearGradient>
              <linearGradient id="mwMilkG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fdfcf8" stop-opacity="0"></stop>
                <stop offset="0.3" stop-color="#fbfaf6" stop-opacity="0.9"></stop>
                <stop offset="0.62" stop-color="#fbfaf6" stop-opacity="0.95"></stop>
                <stop offset="1" stop-color="#f6f4ec" stop-opacity="0"></stop>
              </linearGradient>
              <linearGradient id="mwMatchaG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#7fa552" stop-opacity="1"></stop>
                <stop offset="0.45" stop-color="#6f9346" stop-opacity="0.96"></stop>
                <stop offset="0.78" stop-color="#7fa552" stop-opacity="0.6"></stop>
                <stop offset="1" stop-color="#8fbc6a" stop-opacity="0"></stop>
              </linearGradient>
            </defs>
            <path d="M42 34h86l-11 190a8 8 0 0 1-8 7H61a8 8 0 0 1-8-7z" fill="#eef3f6" opacity=".55"></path>
            <g clip-path="url(#mwCup)">
              <rect x="30" y="{{ syrupTop }}" width="120" height="96" fill="url(#mwSyrupG)" style="transition:y .8s cubic-bezier(.4,0,.3,1)"></rect>
              <rect x="30" y="{{ milkTop }}" width="120" height="116" fill="url(#mwMilkG)" style="transition:y .8s cubic-bezier(.4,0,.3,1)"></rect>
              <rect x="30" y="{{ matchaTop }}" width="120" height="96" fill="url(#mwMatchaG)" style="transition:y 1.1s cubic-bezier(.4,0,.3,1)"></rect>
            </g>
            <path d="M42 34h86l-11 190a8 8 0 0 1-8 7H61a8 8 0 0 1-8-7z" fill="none" stroke="#3f3a2e" stroke-width="2.8" stroke-linejoin="round"></path>
            <ellipse cx="85" cy="34" rx="43" ry="8" fill="#f7fbfd" stroke="#3f3a2e" stroke-width="2.8"></ellipse>
            <path d="M60 50l-6 170" stroke="#fff" stroke-width="6" opacity=".55" stroke-linecap="round"></path>
          </svg>
          <button onClick="{{ bowlClick }}" title="{{ bowlHint }}" style="all:unset;position:absolute;right:-38px;top:{{ pourBowlTop }};cursor:{{ bowlCursor }};transition:top .5s ease,transform .5s ease,filter .25s ease;transform:{{ pourBowlTransform }};animation:{{ bowlNudge }}" style-hover="filter:drop-shadow(0 5px 11px rgba(111,147,70,.6)) brightness(1.05)">
            <svg viewBox="0 0 96 64" width="86" height="58"><path d="M8 18h72c0 22-16 34-36 34S8 40 8 18z" fill="#efe7d3" stroke="#3f3a2e" stroke-width="2.8" stroke-linejoin="round"></path><ellipse cx="44" cy="18" rx="36" ry="10" fill="#6f9346" stroke="#3f3a2e" stroke-width="2.8"></ellipse><ellipse cx="44" cy="17" rx="24" ry="6" fill="#a9c583" opacity=".85"></ellipse><path d="M80 14l12 4-12 8z" fill="#efe7d3" stroke="#3f3a2e" stroke-width="2.6" stroke-linejoin="round"></path></svg>
          </button>
        </div>

      </div>
    </sc-if>

  </div>

  <sc-if value="{{ showResult }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:rgba(63,58,46,.28);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:26px;animation:mwFade .3s ease both">
      <div style="width:100%;background:#faf4e4;border:2.6px solid #3f3a2e;border-radius:26px;padding:26px 22px;text-align:center;box-shadow:0 10px 0 rgba(63,58,46,.16);animation:mwPop .35s cubic-bezier(.34,1.4,.64,1) both">
        <div style="font-family:'Space Mono',monospace;font-size:23px;font-weight:700;letter-spacing:-.4px">{{ resultTitle }}</div>
        <p style="margin:14px 0 0;font-family:'Space Mono',monospace;font-size:13px;line-height:1.6;color:#4a4436;text-wrap:pretty">{{ resultNote }}</p>

        <sc-if value="{{ showCompare }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:18px;display:flex;gap:14px;justify-content:center">
            <div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:66px;height:66px;border-radius:50%;border:2.4px solid #3f3a2e;background:{{ yourColor }}"></div><span style="font-family:'Space Mono',monospace;font-size:10px;color:#6b6350">yours</span></div>
            <div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:66px;height:66px;border-radius:50%;border:2.4px solid #3f3a2e;background:{{ targetColor }}"></div><span style="font-family:'Space Mono',monospace;font-size:10px;color:#6b6350">target</span></div>
          </div>
        </sc-if>

        <sc-if value="{{ showHint }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:18px;padding:14px;border-radius:16px;background:#efe7cf;border:1.6px dashed #b8a578;animation:mwFade .3s ease both">
            <div style="font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:#8a7449">whisk toward this</div>
            <div style="margin:10px auto 0;width:88px;height:88px;border-radius:50%;border:2.6px solid #3f3a2e;background:{{ targetColor }};box-shadow:inset 0 -8px 16px rgba(0,0,0,.12)"></div>
            <div style="margin-top:10px;font-family:'Space Mono',monospace;font-size:11.5px;color:#4a4436">match this froth colour</div>
          </div>

        <div style="margin-top:20px;display:flex;flex-direction:column;gap:10px;align-items:center">
          <button onClick="{{ primaryAction }}" style="all:unset;cursor:pointer;padding:13px 24px;border-radius:24px;background:#4a6741;color:#f7f1e1;font-family:'Space Mono',monospace;font-size:13.5px;box-shadow:0 3px 0 #35492f" style-hover="background:#3f5a38" style-active="transform:translateY(2px);box-shadow:0 1px 0 #35492f">{{ primaryLabel }}</button>
          <sc-if value="{{ hintAvailable }}" hint-placeholder-val="{{ false }}">
            <button onClick="{{ revealHint }}" style="all:unset;cursor:pointer;padding:11px 20px;border-radius:22px;border:2px solid #b8a578;color:#8a7449;font-family:'Space Mono',monospace;font-size:12px" style-hover="background:#efe7cf">Give me a hint</button>
          </sc-if>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ showDone }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:rgba(63,58,46,.3);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:26px;animation:mwFade .3s ease both">
      <div style="width:100%;background:#faf4e4;border:2.6px solid #3f3a2e;border-radius:26px;padding:24px 22px;text-align:center;box-shadow:0 10px 0 rgba(63,58,46,.16);animation:mwPop .35s cubic-bezier(.34,1.4,.64,1) both">
        <div style="font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:#8a7449">served</div>
        <div style="margin-top:8px;font-size:32px;line-height:1.15">{{ drinkName }}</div>
        <div style="margin:16px auto 0;width:112px;height:150px;border-radius:10px;background:linear-gradient(#eef3f6,#e3ebef);border:2.4px solid #3f3a2e;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end">
          <div style="height:100%;background:linear-gradient(#7fa552 0%,#6f9346 26%,#a9c98a 40%,#fbfaf6 54%,#fbfaf6 64%,{{ syrupColor }} 86%,{{ syrupColor }} 100%)"></div>
        </div>
        <p style="margin:16px 0 0;font-family:'Space Mono',monospace;font-size:12px;line-height:1.6;color:#4a4436">Froth {{ frothRounded }} · {{ tinName }} · {{ syrupName }}</p>
        <button onClick="{{ playAgain }}" style="all:unset;cursor:pointer;margin-top:18px;padding:13px 24px;border-radius:24px;background:#4a6741;color:#f7f1e1;font-family:'Space Mono',monospace;font-size:13.5px;box-shadow:0 3px 0 #35492f" style-hover="background:#3f5a38">Play Again</button>
      </div>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:852},&quot;whiskStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;drag&quot;,&quot;hold&quot;,&quot;tap&quot;],&quot;default&quot;:&quot;drag&quot;,&quot;tsType&quot;:&quot;'drag'|'hold'|'tap'&quot;,&quot;section&quot;:&quot;Variations&quot;},&quot;failStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;playful&quot;,&quot;master&quot;,&quot;split&quot;],&quot;default&quot;:&quot;playful&quot;,&quot;tsType&quot;:&quot;'playful'|'master'|'split'&quot;,&quot;section&quot;:&quot;Variations&quot;},&quot;latteStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tray&quot;,&quot;shelf&quot;],&quot;default&quot;:&quot;tray&quot;,&quot;tsType&quot;:&quot;'tray'|'shelf'&quot;,&quot;section&quot;:&quot;Variations&quot;},&quot;hintAfterFails&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:5,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Difficulty&quot;,&quot;unit&quot;:&quot;fails (0 = no hint)&quot;}}">
const TINS = [
  {id:'isuzu', name:'isuzu matcha', img:'uploads/tin_isuzu.png', body:'#f4f1e6', band:'#fffdf5', lid:'#c3cf8e'},
  {id:'ogura', name:'ogurayama', img:'uploads/tin_ogura.png', body:'#b39a56', band:'#3f6b32', lid:'#6f8f45'},
  {id:'rocky', name:"rocky's matcha", img:'uploads/tin_rocket.png', body:'#25407a', band:'#4fae5a', lid:'#1c3260'},
  {id:'nami', name:'nami yame', img:'uploads/tin_yame.png', body:'#f6f0dc', band:'#efe9d4', lid:'#d9d4c2'}
];
const SYRUPS = [
  {id:'strawberry', name:'strawberry', color:'#c9384a', drink:'Strawberry Matcha Latte'},
  {id:'blueberry', name:'blueberry', color:'#3a4f9e', drink:'Blueberry Matcha Latte'},
  {id:'mango', name:'mango', color:'#e8a52c', drink:'Mango Matcha Latte'}
];

function lerp(a,b,t){return a+(b-a)*t;}
function mix(c1,c2,t){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const A=p(c1),B=p(c2);
  return 'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')';
}
const frothColor = v => mix('#3a5233','#c2d6a4',Math.max(0,Math.min(1,v/100)));

class Component extends DCLogic {
  state = {
    screen:'start', stage:'tin', tin:null, lidOpen:false, pouring:false,
    froth:0, seconds:20, attempts:0, showResult:false, showHint:false,
    success:false, target: 55 + Math.random()*35, syrup:null, latteStep:'pick', showDone:false
  };

  f = 0; bubbles = []; revs = []; pointer = null; isDown = false;
  lastX = null; dir = 0; t0 = 0; lastTick = 0; beat = 0; timeUp = false;
  noise = Array.from({length:70},()=>({a:Math.random()*Math.PI*2,r:Math.random(),s:3+Math.random()*7}));

  loop = (t) => {
    this.raf = requestAnimationFrame(this.loop);
    this.beat = t;
    const dt = this.lastTick ? Math.min(50, t-this.lastTick) : 16;
    this.lastTick = t;
    try {
      if(this.state.screen==='whisk') this.tick(dt);
      this.draw();
    } catch(err){ console.warn('mw frame', err); }
  };
  ensureLoop(){
    const now = (typeof performance!=='undefined') ? performance.now() : Date.now();
    if(this.raf && now - this.beat < 500) return;
    cancelAnimationFrame(this.raf);
    this.lastTick = 0;
    this.raf = requestAnimationFrame(this.loop);
  }
  componentDidMount(){
    this.chasen = new Image(); this.chasen.src = 'uploads/chasen.png';
    this.bowlImg = new Image(); this.bowlImg.src = 'uploads/bowl.png';
    this.ensureLoop();
  }
  componentDidUpdate(){ this.ensureLoop(); }
  componentWillUnmount(){ cancelAnimationFrame(this.raf); this.raf = null; }

  style(){ return this.props.whiskStyle || 'drag'; }

  tick(dt){
    const now = performance.now();
    this.revs = this.revs.filter(x => now-x < 700);
    if(this.style()==='drag'){
      const rate = this.revs.length;
      if(rate>=2) this.f = Math.min(100, this.f + Math.min(rate,6)*8*(dt/1000));
    } else if(this.style()==='hold'){
      if(this.isDown) this.f = Math.min(100, this.f + 13*(dt/1000));
    }
    this.bubbles.forEach(b=>{ b.a -= dt/1400; b.y -= dt/260; });
    this.bubbles = this.bubbles.filter(b=>b.a>0).slice(-260);
    const left = Math.max(0, 20 - Math.floor((now-this.t0)/1000));
    if(left!==this.state.seconds || Math.abs(this.f-this.state.froth)>0.8) this.setState({seconds:left, froth:this.f});
    if(left===0 && !this.timeUp){ this.timeUp = true; this.finish(); }
  }

  spawn(x,y,n){
    const fine = this.f/100;
    for(let i=0;i<n;i++) this.bubbles.push({
      x: x + (Math.random()-.5)*46, y: y + (Math.random()-.5)*46,
      r: lerp(7,2.2,fine)*(0.6+Math.random()*0.8), a: 1
    });
  }

  local(e){
    const c = this.canvas; if(!c) return null;
    const r = c.getBoundingClientRect();
    return {x:(e.clientX-r.left)/r.width*600, y:(e.clientY-r.top)/r.height*600};
  }

  draw(){
    const c = this.canvas; if(!c) return;
    const g = c.getContext('2d');
    const st = this.state.stage, cx=306, cy=300, R=252, RL=235;
    g.clearRect(0,0,600,600);
    g.save();
    g.beginPath(); g.ellipse(cx, cy+38, R+4, R-2, 0,0,7); g.fillStyle='rgba(138,116,73,.20)'; g.fill();
    const bi=this.bowlImg;
    if(bi && bi.complete && bi.naturalWidth){
      const s=258/206.5;
      g.drawImage(bi, 306-242.5*s, 300-230.5*s, bi.naturalWidth*s, bi.naturalHeight*s);
    } else {
      g.beginPath(); g.arc(cx,cy,R+16,0,7); g.fillStyle='#c9a969'; g.fill();
      g.beginPath(); g.arc(cx,cy,RL,0,7); g.fillStyle='#ece2c4'; g.fill();
    }
    if(st!=='tin' && st!=='scoop' && st!=='pour'){
      g.beginPath(); g.arc(cx,cy,RL,0,7); g.fillStyle = frothColor(this.f); g.fill();
    }

    if(st==='scoop'||st==='pour'||st==='pouring'){
      if(st!=='scoop' || this.scooped){
        g.beginPath(); g.ellipse(cx,cy,58,34,0,0,7); g.fillStyle='#5f7d3e'; g.fill();
        g.beginPath(); g.ellipse(cx-14,cy-8,20,11,0,0,7); g.fillStyle='rgba(255,255,255,.18)'; g.fill();
      }
    }

    if(st==='whisk'){
      if(this.f<40){
        const a=(40-this.f)/40*0.32;
        g.fillStyle='rgba(40,60,34,'+a+')';
        this.noise.forEach(n=>{
          const rr = n.r*R*0.72;
          g.beginPath(); g.arc(cx+Math.cos(n.a)*rr, cy+Math.sin(n.a)*rr, n.s*1.6,0,7); g.fill();
        });
      }
      g.save();
      g.beginPath(); g.arc(cx,cy,RL-2,0,7); g.clip();
      this.bubbles.forEach(b=>{
        g.beginPath(); g.arc(b.x,b.y,b.r,0,7);
        g.fillStyle='rgba(240,247,224,'+(b.a*0.78)+')'; g.fill();
      });
      g.restore();
      const p=this.pointer;
      if(p){
        g.save(); g.translate(p.x,p.y);
        if(this.chasen && this.chasen.complete && this.chasen.naturalWidth){
          const w=176, hh=220;
          g.rotate(Math.PI);
          g.drawImage(this.chasen, -w/2, -72, w, hh);
        } else {
          g.strokeStyle='rgba(240,246,220,.85)'; g.lineWidth=3.4;
          for(let i=-5;i<=5;i++){ g.beginPath(); g.moveTo(i*3,-46); g.lineTo(i*7,26); g.stroke(); }
        }
        g.restore();
      }
    }
    g.beginPath(); g.arc(cx,cy,RL-6,0,7);
    g.strokeStyle='rgba(90,70,40,.13)'; g.lineWidth=12; g.stroke();
    g.restore();
  }

  down = (e) => {
    if(this.state.stage!=='whisk') return;
    e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId);
    this.isDown = true;
    const p = this.local(e); this.pointer = p; this.lastX = p && p.x;
    if(this.style()==='tap' && p){ this.f = Math.min(100,this.f+5.5); this.spawn(p.x,p.y,7); }
  };
  move = (e) => {
    if(this.state.stage!=='whisk') return;
    const p = this.local(e); if(!p) return;
    const inBowl = Math.hypot(p.x-300,p.y-300) < 250;
    if(!inBowl){ this.pointer=null; this.lastX=null; this.revs=[]; return; }
    this.pointer = p;
    if(!this.isDown && this.style()==='drag') return;
    if(this.lastX!=null){
      const dx = p.x - this.lastX;
      if(Math.abs(dx) > 130){ this.f = Math.max(0,this.f-6); this.revs=[]; }
      else if(Math.abs(dx) > 5){
        const nd = dx>0?1:-1;
        if(this.dir!==0 && nd!==this.dir) this.revs.push(performance.now());
        this.dir = nd;
        if(this.revs.length>=2) this.spawn(p.x,p.y,2);
      }
    }
    this.lastX = p.x;
  };
  up = () => { this.isDown=false; this.lastX=null; this.dir=0; this.revs=[]; if(this.style()!=='drag') this.pointer=this.pointer; };

  pick = (i) => () => { this.scooped=false; this.setState({tin:TINS[i], screen:'bench', stage:'tin', lidOpen:false}); };
  tapTin = () => {
    if(this.state.stage!=='tin') return;
    if(this.state.lidOpen) return;
    this.setState({lidOpen:true});
    setTimeout(()=>this.setState({stage:'scoop'}),450);
  };
  tapChashaku = () => {
    if(this.state.stage!=='scoop') return;
    this.setState({scooping:true});
    setTimeout(()=>{ this.scooped = true; },520);
    setTimeout(()=>this.setState({stage:'pour', scooping:false, lidOpen:false}),900);
  };
  tapKettle = () => {
    if(this.state.stage!=='pour') return;
    this.setState({pouring:true, stage:'pouring'});
    setTimeout(()=>{
      this.f=0; this.bubbles=[]; this.revs=[]; this.t0=performance.now(); this.timeUp=false;
      this.setState({pouring:false, stage:'whisk', screen:'whisk', seconds:0, froth:0});
    },2400);
  };

  finish = () => {
    const diff = Math.abs(this.f - this.state.target);
    const success = diff <= 8;
    this.setState(s=>({
      screen:'result', stage:'whisk', showResult:true, success,
      attempts: success ? s.attempts : s.attempts+1, showHint:false
    }));
  };
  revealHint = () => this.setState({showHint:true, hintUnlocked:true});
  retry = () => {
    this.f=0; this.bubbles=[]; this.revs=[]; this.t0=performance.now(); this.timeUp=false;
    this.setState({showResult:false, showHint:false, screen:'whisk', stage:'whisk', froth:0, seconds:0});
  };
  toLatte = () => this.setState({showResult:false, screen:'latte', latteStep:'pick'});
  pickSyrup = (i) => () => this.setState({syrup:SYRUPS[i], latteStep:'poured'});
  bowlClick = () => {
    if(this.state.latteStep!=='poured') return;
    this.setState({latteStep:'matcha'});
    setTimeout(()=>this.setState({latteStep:'done'}),1250);
    setTimeout(()=>this.setState({showDone:true}),2150);
  };
  playAgain = () => {
    this.f=0; this.bubbles=[]; this.revs=[]; this.timeUp=false; this.scooped=false;
    this.setState({screen:'start', stage:'tin', tin:null, lidOpen:false, syrup:null, latteStep:'pick',
      showDone:false, showResult:false, showHint:false, hintUnlocked:false, attempts:0, froth:0, seconds:20,
      target: 55+Math.random()*35});
  };

  renderVals(){
    const s = this.state, tin = s.tin||TINS[0];
    const failStyle = this.props.failStyle || 'playful';
    const latteStyle = this.props.latteStyle || 'tray';
    const hintAfter = this.props.hintAfterFails ?? 0;
    const isLatte = s.screen==='latte';
    const st = s.stage;
    const diff = Math.abs(s.froth - s.target);

    let resultTitle='', resultNote='';
    if(s.success){
      resultTitle='Just Right';
      resultNote='Your froth landed at '+Math.round(s.froth)+', bang on. You read the foam beautifully.';
    } else if(failStyle==='master'){
      resultTitle = s.froth < s.target ? 'A Little Shy' : 'A Little Eager';
      resultNote = s.froth < s.target
        ? 'The old master would say: your wrist stopped before the foam did. Stay with it a few breaths longer.'
        : 'The old master would say: you kept going past the good part. Ease off a touch sooner next time.';
    } else if(failStyle==='split'){
      resultTitle='Not This Bowl';
      resultNote='Yours came out at '+Math.round(s.froth)+'. Compare the two and try again.';
    } else {
      resultTitle = diff>28 ? 'Oh No, Soup' : (s.froth<s.target ? 'Nearly! Keep Going' : 'Whoa There, Chef');
      resultNote = diff>28
        ? 'That bowl is having a rough day. Dump it out and start fresh, nobody saw.'
        : (s.froth<s.target ? 'So close. A few more zig-zags and that foam would have sung.' : 'You whisked it into a cloud. Gorgeous, but too much cloud.');
    }

    const stepMsg = {
      tin: s.lidOpen ? '' : 'Lovely choice. Go ahead and open your '+tin.name,
      scoop: 'take the chashaku and scoop in some matcha',
      pour: 'now pour in warm water',
      pouring: 'steady... let it settle',
      whisk: ''
    };

    let instruction = '';
    if(s.screen==='start') instruction='Choose the matcha that speaks to you today';
    else if(isLatte) instruction = s.latteStep==='pick' ? 'pick a syrup for the bottom' : (s.latteStep==='poured' ? 'tap the bowl to pour the matcha in' : 'pouring...');
    else instruction = stepMsg[st] || '';

    const syrup = s.syrup || SYRUPS[0];
    const step = s.latteStep;
    const syrupTop = step==='pick' ? 252 : 158;
    const milkTop  = step==='pick' ? 252 : 74;
    const matchaTop = (step==='matcha'||step==='done') ? 16 : 252;

    return {
      heading: isLatte ? 'Matcha Latte' : 'Matcha Whisk',
      subhead: isLatte ? "Let's customize a matcha latte"
        : 'Choose your matcha and whisk away gently in soft zig-zag motions. No meter to watch, just your own good feeling. Stop whenever it looks right to you.',
      instruction,
      isStart: s.screen==='start',
      isBench: s.screen==='bench' || s.screen==='whisk' || s.screen==='result',
      isWhisk: st==='whisk',
      isLatte,
      seconds: s.seconds,
      secondsColor: s.seconds <= 5 ? '#b5432f' : '#6b6350',
      canvasRef: (el)=>{ this.canvas = el; if(el) this.ensureLoop(); },
      bowlCursor: st==='whisk' ? 'grab' : 'default',
      pick0:this.pick(0), pick1:this.pick(1), pick2:this.pick(2), pick3:this.pick(3),
      tinName: tin.name, isIsuzu: tin.id==='isuzu', isOgura: tin.id==='ogura', isRocky: tin.id==='rocky', isNami: tin.id==='nami', tinBody: tin.body, tinBand: tin.band, tinLid: tin.lid,
      lidTransform: s.lidOpen ? 'translateY(-8px) rotate(-7deg) scale(1.04)' : 'none',
      tinOpacity: st==='tin' ? 1 : .35,
      tinPouring: false,
      chashakuOpacity: st==='scoop' ? 1 : .35,
      chashakuZ: s.scooping ? 6 : 1,
      chashakuTransform: s.scooping ? 'translate(-40px,150px) rotate(38deg)' : 'none',
      chashakuLabel: st==='scoop' ? '#3f3a2e' : '#9a8f74',
      kettleOpacity: s.pouring ? 0 : (st==='pour' ? 1 : .35),
      kettleTransform: 'none',
      kettleLabel: (st==='pour'||st==='pouring') ? '#3f3a2e' : '#9a8f74',
      pouring: s.pouring,
      tapTin:this.tapTin, tapChashaku:this.tapChashaku, tapKettle:this.tapKettle,
      down:this.down, move:this.move, up:this.up, finish:this.finish,
      showResult: s.showResult,
      resultTitle, resultNote,
      showCompare: !s.success && !s.showHint,
      yourColor: frothColor(s.froth),
      targetColor: frothColor(s.target),
      showHint: s.showHint,
      hintDocked: !!s.hintUnlocked,
      hintAvailable: hintAfter>0 && !s.success && s.attempts>=hintAfter && !s.showHint,
      revealHint:this.revealHint,
      primaryLabel: s.success ? 'Make Matcha Latte' : 'Whisk Again',
      primaryAction: s.success ? this.toLatte : this.retry,
      frothRounded: Math.round(s.froth),
      syrups: SYRUPS.map((x,i)=>({
        name:x.name, pick:this.pickSyrup(i),
        isStrawberry:x.id==='strawberry', isBlueberry:x.id==='blueberry', isMango:x.id==='mango',
        bg: s.syrup && s.syrup.id===x.id ? 'rgba(184,165,120,.34)' : 'transparent'
      })),
      pickerDir: latteStyle==='shelf' ? 'column' : 'row',
      pickerGap: latteStyle==='shelf' ? '6px' : '26px',
      showSyrupNames: latteStyle==='shelf',
      syrupColor: syrup.color, syrupName: syrup.name,
      syrupTop, milkTop, matchaTop,
      pourBowlTop: (step==='matcha'||step==='done') ? '-24px' : '150px',
      pourBowlTransform: (step==='matcha'||step==='done') ? 'rotate(-38deg) translateX(-34px)' : 'none',
      bowlClick:this.bowlClick,
      bowlCursor: step==='poured' ? 'pointer' : 'default',
      bowlHint: step==='poured' ? 'pour the matcha in' : '',
      bowlNudge: step==='poured' ? 'mwBowlNudge 1.8s ease-in-out infinite' : 'none',
      showDone: s.showDone,
      drinkName: syrup.drink,
      playAgain:this.playAgain
    };
  }
}

</script>
</body>
